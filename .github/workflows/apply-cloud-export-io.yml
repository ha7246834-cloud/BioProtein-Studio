name: Apply cloud export I/O patch

on:
  push:
    branches:
      - fix/cloud-export-io

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-export-io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_cloud_export_io.py
      - name: Syntax check
        run: python -m py_compile pages/2_Gene_Structure_Domain_Motif.py
      - name: Commit patched page
        run: |
          if git diff --quiet -- pages/2_Gene_Structure_Domain_Motif.py; then
            echo 'No page changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/2_Gene_Structure_Domain_Motif.py
          git commit -m 'Make figure export single-format and avoid cloud autosave I/O'
          git push origin HEAD:fix/cloud-export-io
