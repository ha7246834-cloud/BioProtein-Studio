name: Apply cloud stable runtime v3

on:
  push:
    branches:
      - fix/cloud-stable-runtime-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-stable-runtime-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_cloud_stable_runtime_v3.py
      - name: Syntax check
        run: |
          python -m py_compile modules/gdm_phylogeny.py pages/2_Gene_Structure_Domain_Motif.py tests/test_large_family_stability.py
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gdm_phylogeny.py pages/2_Gene_Structure_Domain_Motif.py tests/test_large_family_stability.py
          if git diff --cached --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git commit -m 'Make Streamlit Cloud phylogeny FastTree-only'
          git push origin HEAD:fix/cloud-stable-runtime-v3
