name: Apply large-family progress UX patch

on:
  push:
    branches:
      - fix/large-family-progress-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/large-family-progress-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_large_family_progress.py
      - name: Syntax check
        run: python -m py_compile modules/gdm_cdd_meme.py pages/2_Gene_Structure_Domain_Motif.py
      - name: Commit patched files
        run: |
          if git diff --quiet -- modules/gdm_cdd_meme.py pages/2_Gene_Structure_Domain_Motif.py; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/gdm_cdd_meme.py pages/2_Gene_Structure_Domain_Motif.py
          git commit -m 'Show live large-family analysis progress'
          git push origin HEAD:fix/large-family-progress-ux
