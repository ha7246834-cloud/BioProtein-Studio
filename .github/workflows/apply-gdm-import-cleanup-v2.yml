name: Apply GDM import cleanup v2

on:
  push:
    branches:
      - fix/cloud-iqtree-thresholds-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-iqtree-thresholds-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean duplicated imports
        run: python tools/cleanup_gdm_imports_v2.py
      - name: Syntax check
        run: python -m py_compile pages/2_Gene_Structure_Domain_Motif.py
      - name: Commit cleanup
        run: |
          if git diff --quiet -- pages/2_Gene_Structure_Domain_Motif.py; then
            echo 'No cleanup required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/2_Gene_Structure_Domain_Motif.py
          git commit -m 'Clean duplicated GDM imports'
          git push origin HEAD:fix/cloud-iqtree-thresholds-v2
