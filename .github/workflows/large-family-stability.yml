name: Large family stability

on:
  pull_request:
    paths:
      - 'modules/runtime.py'
      - 'modules/gdm_phylogeny.py'
      - 'modules/gdm_plot.py'
      - 'modules/gdm_circular.py'
      - 'modules/gdm_clade_validation.py'
      - 'modules/gdm_cdd_meme.py'
      - 'modules/gdm_reference.py'
      - 'modules/gdm_structure.py'
      - 'pages/2_Gene_Structure_Domain_Motif.py'
      - 'pages/3_Circular_Phylogeny.py'
      - 'vendor/bin/meme'
      - 'tests/test_runtime_sandbox.py'
      - 'tests/test_large_family_stability.py'
      - 'tests/test_circular_phylogeny.py'
      - 'tests/test_clade_validation.py'
      - 'tests/test_cdd_meme_cloud_stability.py'
      - 'tests/test_gene_structure_performance.py'
      - 'tests/test_cloud_preflight_ui.py'
      - 'tests/test_cloud_runtime_policy.py'
      - 'tests/test_streamlit_gdm_smoke.py'
      - '.github/workflows/large-family-stability.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile \
            modules/runtime.py \
            modules/gdm_phylogeny.py \
            modules/gdm_plot.py \
            modules/gdm_circular.py \
            modules/gdm_clade_validation.py \
            modules/gdm_cdd_meme.py \
            modules/gdm_reference.py \
            modules/gdm_structure.py \
            pages/2_Gene_Structure_Domain_Motif.py \
            pages/3_Circular_Phylogeny.py
      - name: Run stability tests
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest -v \
            tests.test_runtime_sandbox \
            tests.test_large_family_stability \
            tests.test_circular_phylogeny \
            tests.test_clade_validation \
            tests.test_cdd_meme_cloud_stability \
            tests.test_gene_structure_performance \
            tests.test_cloud_preflight_ui \
            tests.test_cloud_runtime_policy \
            tests.test_streamlit_gdm_smoke
