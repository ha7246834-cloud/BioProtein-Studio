name: Apply reviewed GDM patch series

on:
  push:
    branches:
      - fix/gdm-runtime-sandbox-claude-reviewed
    paths:
      - '.github/workflows/apply-gdm-patches.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed code patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BioProtein Studio automation"
          git config user.email "actions@users.noreply.github.com"

          for patch in .patches/0001-*.patch .patches/0002-*.patch .patches/0003-*.patch .patches/0004-*.patch; do
            echo "Applying ${patch}"
            git am "${patch}"
          done

          echo "Applying documentation portion of patch 5 (workflow update will be done through the GitHub connector)."
          git apply --exclude='.github/workflows/large-family-stability.yml' .patches/0005-*.patch
          git add notes/root-cause-and-sandbox-2026-09-14.md
          git commit -m "Document GDM worker-crash measurements and sandbox plan"

          for patch in .patches/0006-*.patch .patches/0007-*.patch; do
            echo "Applying ${patch}"
            git am "${patch}"
          done

          git push origin "HEAD:${GITHUB_REF_NAME}"
